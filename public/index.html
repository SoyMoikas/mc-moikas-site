<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moikas</title>
  <meta name="description" content="Moikas community game servers: how to join, which modpacks to install, events and community tasks.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css?v=13">
</head>
<body>
  <main class="wrap">
    <div class="home-cols">
      <section class="col-main">
        <div id="games" class="game-strip"></div>
        <div class="section-head"><h2 data-i18n="feed.title">For you</h2></div>
        <div id="feed"></div>
      </section>
      <aside class="col-side">
        <section class="side-block">
          <div class="section-head">
            <h2 data-i18n="home.announcements">Announcements</h2>
            <button id="new-post" class="hidden small-btn" data-i18n="home.newAnnouncementShort">+ New</button>
          </div>
          <div id="post-form"></div>
          <div id="posts"><p class="muted" data-i18n="loading">Loading…</p></div>
        </section>
        <section class="side-block side-chat">
          <div class="section-head"><h2 data-i18n="chat.general">General chat</h2></div>
          <div id="chat"></div>
        </section>
      </aside>
    </div>
  </main>
  <footer class="wrap"><p data-i18n="footer">Not affiliated with Mojang or Microsoft.</p></footer>
  <script type="module" src="/app/index.js"></script>
</body>
</html>
