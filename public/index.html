<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moikas MC</title>
  <meta name="description" content="Moikas community game servers: how to join, which modpacks to install, events and community tasks.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="hero">
    <div class="wrap">
      <h1>Moikas MC</h1>
      <p>Community game servers. Open to everyone, built together.</p>
    </div>
  </div>
  <main class="wrap">
    <section>
      <div class="section-head"><h2>Servers</h2></div>
      <div id="servers" class="grid"><p class="muted">Loading…</p></div>
    </section>
    <section>
      <div class="section-head">
        <h2>Announcements</h2>
        <button id="new-post" class="hidden">+ New announcement</button>
      </div>
      <div id="post-form"></div>
      <div id="posts"><p class="muted">Loading…</p></div>
    </section>
  </main>
  <footer class="wrap"><p>Not affiliated with Mojang or Microsoft.</p></footer>
  <script type="module" src="/js/index.js"></script>
</body>
</html>
