name = "moikas-mc"
compatibility_date = "2026-06-01"
pages_build_output_dir = "./public"

[vars]
# Your Discord user ID (Discord → Settings → Advanced → Developer Mode, then right-click your name → Copy User ID).
# This account is always admin.
ADMIN_DISCORD_ID = "260485507882942476"
# Discord application "Client_id" (public, not secret).
DISCORD_CLIENT_ID = "1568770697231077420"
# Hostname shown for servers that don't set their own address (non-default ports become play.moikas.cc:PORT).
PUBLIC_HOST = "games.moikas.cc"

# Secrets are NOT stored here. Add them in Cloudflare → your Pages project → Settings → Variables and Secrets:
#   DISCORD_CLIENT_SECRET   (from the Discord app's OAuth2 page)
#   SYNC_SECRET             (a long random string; the same value goes in sync/sync.env on the NAS)

[[d1_databases]]
binding = "DB"
database_name = "moikas-mc"
database_id = "439c5c05-9111-44e9-baa1-f2e803b4b682"
